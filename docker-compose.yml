services:
  postgres:
    image: docker.io/library/postgres:16
    container_name: blackjack-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - blackjack_pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro

  api:
    build: ./backend
    container_name: blackjack-api
    env_file:
      - ./backend/.env
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      - postgres

volumes:
  blackjack_pgdata:
