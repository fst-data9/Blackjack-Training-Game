services:
  postgres:
    image: docker.io/library/postgres:16
    container_name: blackjack-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - blackjack_pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: blackjack-api
    env_file:
      - ./backend/.env
    ports:
      - "127.0.0.1:3001:3001"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      - postgres

volumes:
  blackjack_pgdata:
    name: ${POSTGRES_VOLUME_NAME:-blackjack_pgdata}
