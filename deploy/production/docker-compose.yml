services:
  caddy:
    image: docker.io/library/caddy:2-alpine
    container_name: blackjack-caddy
    profiles: ["production"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/production/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  caddy_data:
    name: blackjack_production_caddy_data
  caddy_config:
    name: blackjack_production_caddy_config
