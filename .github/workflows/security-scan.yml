name: Weekly security scans

on:
  schedule:
    - cron: "15 3 * * 1"
  workflow_dispatch:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: security-scans-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dependency-audit:
    name: Production dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --prefix backend
      - run: npm audit --prefix backend --omit=dev --audit-level=high

  container-scan:
    name: Container scan (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [api, postgres, caddy]
    steps:
      - uses: actions/checkout@v5
      - name: Select or build the image
        env:
          SCAN_TARGET: ${{ matrix.target }}
        run: |
          case "$SCAN_TARGET" in
            api)
              docker build --pull -f backend/Dockerfile -t blackjack-security-scan:api .
              echo "SCAN_IMAGE=blackjack-security-scan:api" >> "$GITHUB_ENV"
              ;;
            postgres)
              docker build --pull -f deploy/postgres/Dockerfile -t blackjack-security-scan:postgres .
              echo "SCAN_IMAGE=blackjack-security-scan:postgres" >> "$GITHUB_ENV"
              ;;
            caddy)
              docker build --pull -f deploy/caddy/Dockerfile -t blackjack-security-scan:caddy .
              echo "SCAN_IMAGE=blackjack-security-scan:caddy" >> "$GITHUB_ENV"
              ;;
          esac
      - name: Scan image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.SCAN_IMAGE }}
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false
